name: Federal Register Scraper

on:
  schedule:
    # 6 AM ET (11:00 UTC) every weekday — Federal Register publishes by ~8 AM ET
    - cron: '0 11 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'daily = scrape one date | backfill = June 11 → yesterday | specific = enter date below'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill
          - specific
      date:
        description: 'Date to scrape (YYYY-MM-DD) — only used when mode = specific'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to commit scraped data back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── daily (scheduled or manual) ──────────────────────────────────────
      - name: Scrape previous business day
        if: >
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily')
        run: python scraper.py

      # ── specific date ────────────────────────────────────────────────────
      - name: Scrape specific date
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'specific'
        run: python scraper.py "${{ inputs.date }}"

      # ── backfill (June 11 → yesterday, skips already-scraped dates) ──────
      - name: Backfill from June 11 2026
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill'
        run: python backfill.py 2026-06-11

      # ── commit and push any new data files ───────────────────────────────
      - name: Commit scraped data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No new data to commit." || \
            git commit -m "scrape: $(date -u +%Y-%m-%d)" && git push
